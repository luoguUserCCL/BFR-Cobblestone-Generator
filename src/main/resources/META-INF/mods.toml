modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Wilyicaro/BetterFurnacesReforged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

This mod is a standalone extraction of the Cobblestone Generator feature from
BetterFurnacesReforged by Icaro K. Bomfim, distributed under the MIT License.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="factory_api"
    mandatory=true
    versionRange="[1.20.1-2.2,)"
    ordering="AFTER"
    side="BOTH"
